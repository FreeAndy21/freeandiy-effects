# This repository's FreeANDIY settings (branding.toml is shared by all FreeANDIY repositories).
# Modified-by: FreeANDIY (Free Andy Agency), 2026. New file, not part of upstream EffectCraft.

app = "effects" # which [apps.<id>] entry of branding.toml this repository builds

[build]
# cargo arguments for the release binaries, the tests sync-upstream.sh runs, and the web page.
bins = "-p effectcraft -p effectcraft-cli"
features = ""
tests = "-p effectcraft-ui-egui -p effectcraft-engine -p effectcraft -p effectcraft-cli"
web_index = "apps/effectcraft-web/web/index.html"
test_env = ""
web_env = ""
# Upstream has no test workflow of its own: freeandiy.yml runs build.tests on Linux.
ci_tests = "true"

[check]
# check-branding.sh: extra allowed strings (regex) and Rust paths where the upstream name may stay
# in string literals (git pathspecs, space-separated).
# Also: the bundled text animator presets credit their upstream authors in a note.
# Also: the ScriptUI shim reports frameworkName "EffectCraft", which scripts may test for.
allow = "EffectCraftProject|Original EffectCraft text animator presets|frameworkName: .EffectCraft."
rs_exclude = ":!xtask/**"
